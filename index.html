<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>IMPÉRIO Academia</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="IMPÉRIO" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-96.png" />
    <style>
      *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
      body { background:#0A0A0A; overscroll-behavior:none; }
      #root { min-height:100dvh; }
      /* A interface foi desenhada pro celular. Em telas maiores, o conteúdo
         cresce até uma largura confortável de leitura (não fica esticado
         de ponta a ponta) e o texto/imagens ficam um pouco maiores pra
         não ficar minúsculo num monitor. As grades de cards (Biblioteca,
         fotos) se reorganizam sozinhas em mais colunas conforme o espaço. */
      /* A interface foi desenhada pro celular. Só em computador (tela larga
         + mouse, não tablet/celular) o texto e os elementos ficam maiores,
         pra não ficar minúsculo num monitor. No celular nada muda. */
      @media (min-width:700px) and (pointer:fine) and (hover:hover) {
        body { display:flex; justify-content:center; background:#050505; }
        #root { width:100%; max-width:720px; zoom:1.15; }
        .modal-sheet-overlay { align-items:center !important; padding:24px !important; }
        .modal-sheet-inner { max-height:80vh !important; border-radius:20px !important; }
      }
      @media (min-width:1100px) and (pointer:fine) and (hover:hover) {
        #root { max-width:900px; zoom:1.25; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function() {
          navigator.serviceWorker.register("/sw.js");
        });
      }
    </script>
  </body>
</html>
