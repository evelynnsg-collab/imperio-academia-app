name: Refatorar estrutura do app

on:
  push:
    branches:
      - refactor/organizar-app
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refatorar-e-validar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Refatorar estrutura
        run: node scripts/refatorar-estrutura.mjs

      - name: Instalar dependências
        run: npm ci

      - name: Validar build
        run: npm run build

      - name: Salvar refatoração validada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/services/backend.js src/data/exercises.js
          if git diff --cached --quiet; then
            echo "Nenhuma mudança para salvar."
            exit 0
          fi
          git commit -m "refactor: separa serviços e catálogo do App.jsx"
          git push origin HEAD:refactor/organizar-app
