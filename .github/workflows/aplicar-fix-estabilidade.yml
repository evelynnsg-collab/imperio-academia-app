name: Aplicar correcoes de estabilidade

on:
  push:
    branches:
      - fix/estabilidade-app
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corrigir-e-validar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Aplicar correcoes
        run: node scripts/aplicar-fix-estabilidade.mjs

      - name: Instalar dependencias
        run: npm ci

      - name: Validar build
        run: npm run build

      - name: Salvar correcoes na branch
        run: |
          if git diff --quiet -- src/App.jsx; then
            echo "Nenhuma alteracao pendente."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "fix: corrige estabilidade, sessao e carregamento [skip-fix-workflow]"
          git push origin HEAD:fix/estabilidade-app
